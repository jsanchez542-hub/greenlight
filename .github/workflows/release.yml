name: Release

# Publishes the package to npm when a release is published on GitHub. The package is built and
# checked once, tried on Linux and Windows, and only that same file goes to the job that
# publishes it, which waits for the approval of the "npm" environment. npm records in the
# provenance that the package was built from this repository by this workflow.
# The steps to take around it are in docs/releasing.md.
on:
  release:
    types: [published]

# The jobs only read the repository. The job that publishes asks for more on its own.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # What is published is never built from a cache.
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The tag must name the version that is published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "
            const version = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version;
            if (process.env.TAG !== 'v' + version) {
              console.error('The tag ' + process.env.TAG + ' does not name version ' + version + '.');
              process.exit(1);
            }
          "
      - id: pack
        run: node scripts/check-package.mjs --out "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Try it on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - run: node scripts/verify-checksum.mjs "${{ runner.temp }}/package/greenlight-n8n-${{ needs.build.outputs.version }}.tgz" "${{ needs.build.outputs.sha256 }}"
      - run: node scripts/smoke-package.mjs "${{ runner.temp }}/package/greenlight-n8n-${{ needs.build.outputs.version }}.tgz"

  publish:
    name: Publish to npm
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The approval is asked for here, and the one-time token of the first release lives here.
    environment: npm
    permissions:
      contents: read
      # Lets npm sign the provenance and, once it is set up, publish without any token.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 11.5.1 or later is needed to publish without a token, and Node 24 brings it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: It must be the file that was tried
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          FILE: ${{ runner.temp }}/package/greenlight-n8n-${{ needs.build.outputs.version }}.tgz
        run: echo "$SHA256  $FILE" | sha256sum --check -
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          FILE: ${{ runner.temp }}/package/greenlight-n8n-${{ needs.build.outputs.version }}.tgz
          # Only the first release uses it. Once npm trusts this workflow the secret is deleted
          # and the second branch below is the one that runs.
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          if [ -n "$NPM_PUBLISH_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_PUBLISH_TOKEN" npm publish "$FILE" --provenance --access public --tag "$tag"
          else
            npm publish "$FILE" --provenance --access public --tag "$tag"
          fi

  verify:
    name: Check it on npm, ${{ matrix.os }}
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/verify-published.mjs "${{ needs.build.outputs.version }}"
