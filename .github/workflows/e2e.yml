name: End to end

# Starts a real n8n of each version listed below, puts workflows with known behaviour on it,
# installs the package the way a person would and checks that a scan finds what it should. The
# n8n only lives for the run and nothing that belongs to anyone is ever scanned: e2e/guard.mjs
# refuses any address that is not on the machine running the test. See e2e/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n:
    name: n8n ${{ matrix.n8n }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each image is pinned by its digest, so what is tested is exactly this build of n8n
          # and moving to a newer one is a change to this file.
          - n8n: 2.45.7
            image: n8nio/n8n@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
          - n8n: 3.0.1
            image: n8nio/n8n@sha256:4ebd866ae91d222ffa6dd3731eade80ba71b4d13f7470172a7e66a81fe31faa0
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: pack
        env:
          OUT: ${{ runner.temp }}/package
        run: node scripts/check-package.mjs --out "$OUT"
      - name: Start n8n
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --detach --name n8n --publish 127.0.0.1:5678:5678 \
            --env N8N_DIAGNOSTICS_ENABLED=false \
            --env N8N_VERSION_NOTIFICATIONS_ENABLED=false \
            --env N8N_TEMPLATES_ENABLED=false \
            --env N8N_PERSONALIZATION_ENABLED=false \
            --env N8N_HIRING_BANNER_ENABLED=false \
            --env N8N_SECURE_COOKIE=false \
            "$IMAGE"
      - name: Scan it with the packaged program
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          N8N_VERSION: ${{ matrix.n8n }}
        run: node e2e/run.mjs --url http://127.0.0.1:5678 --package "$TARBALL" --n8n "$N8N_VERSION"
      - name: What n8n said, if the check failed
        if: failure()
        run: docker logs --tail 100 n8n
