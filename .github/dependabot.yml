version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the Node version the project runs on (22), not a newer one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next does not support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # Next and its lint config are released together, one version for both.
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      development:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["eslint-config-next", "@next/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL's init and analyze steps are one release and only run as a pair.
      codeql:
        patterns: ["github/codeql-action/*"]
